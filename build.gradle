plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.blessedmike.arenahelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blessedmike.arenahelper'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
        }
    }
}
