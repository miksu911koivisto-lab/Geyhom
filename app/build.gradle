plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blessedmike.arenahelper'
    compileSdk 35

    defaultConfig {
        applicationId "com.blessedmike.arenahelper"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("ARENA_KEYSTORE_FILE")
            def keystorePasswordValue = System.getenv("ARENA_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("ARENA_KEY_ALIAS")
            def keyPasswordValue = System.getenv("ARENA_KEY_PASSWORD")

            if (keystoreFile != null &&
                    keystorePasswordValue != null &&
                    keyAliasValue != null &&
                    keyPasswordValue != null) {

                storeFile file(keystoreFile)
                storePassword keystorePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'

    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
