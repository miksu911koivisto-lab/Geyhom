name: Build Arena Helper APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ARENA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: GitHub Secret ARENA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n[:space:]' \
            | base64 --decode > arena-helper-release.jks

          if [ ! -s arena-helper-release.jks ]; then
            echo "ERROR: Keystore could not be restored."
            exit 1
          fi

          echo "Keystore restored successfully."

      - name: Build signed release APK
        env:
          ARENA_KEYSTORE_FILE: ${{ github.workspace }}/arena-helper-release.jks
          ARENA_KEYSTORE_PASSWORD: ${{ secrets.ARENA_KEYSTORE_PASSWORD }}
          ARENA_KEY_ALIAS: ${{ secrets.ARENA_KEY_ALIAS }}
          ARENA_KEY_PASSWORD: ${{ secrets.ARENA_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Verify APK exists
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArenaHelper-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Remove signing keystore
        if: always()
        run: |
          rm -f arena-helper-release.jks
