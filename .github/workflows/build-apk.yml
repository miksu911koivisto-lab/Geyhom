name: Build Arena Helper APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ARENA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ARENA_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore arena-helper-release.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias arenahelper \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Arena Helper, OU=ArenaHelper, O=BLESSED MIKE, L=Helsinki, ST=Uusimaa, C=FI"

          if [ ! -s arena-helper-release.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore created successfully."

      - name: Build signed release APK
        env:
          ARENA_KEYSTORE_FILE: ${{ github.workspace }}/arena-helper-release.jks
          ARENA_KEYSTORE_PASSWORD: ${{ secrets.ARENA_KEYSTORE_PASSWORD }}
          ARENA_KEY_ALIAS: arenahelper
          ARENA_KEY_PASSWORD: ${{ secrets.ARENA_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArenaHelper-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Remove signing keystore
        if: always()
        run: |
          rm -f arena-helper-release.jks
