name: Build Arena Helper APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ARENA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: GitHub Secret ARENA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > arena-helper-release.jks

          if [ ! -s arena-helper-release.jks ]; then
            echo "ERROR: Keystore could not be restored."
            exit 1
          fi

      - name: Build signed release APK
        run: |
          gradle :app:assembleRelease \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/arena-helper-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ARENA_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ARENA_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ARENA_KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArenaHelper-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Remove signing keystore
        if: always()
        run: |
          rm -f arena-helper-release.jks
